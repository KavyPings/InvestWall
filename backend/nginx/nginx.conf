# Reverse proxy / API gateway for InvestWall (tech-stack §4 Nginx).
upstream investwall_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    # Allow media uploads (PRD supports video/audio).
    client_max_body_size 60m;

    location / {
        proxy_pass         http://investwall_api;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://investwall_api/health;
        access_log off;
    }
}

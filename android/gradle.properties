org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# --- Java toolchain for Gradle ---
# This project targets stable AGP 8.7 / Gradle 8.11, which do NOT run on JDK 25.
# Your system default `java` is JDK 25, which is why `./gradlew` fails with a
# cryptic "25.0.2" error. We pin the Gradle daemon to the JDK 21 bundled with
# Android Studio (its JBR) so BOTH the command line and Android Studio use the
# same supported JDK. Android Studio also honours this value, so nothing breaks.
#
# If your Android Studio is installed elsewhere, or you use a standalone JDK 17-21,
# change the path below (use forward slashes; spaces are OK, no quotes).
# On CI, remove this line and provide a JDK 17-21 via JAVA_HOME instead.
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr
